<div class="custom-bg-events flex h-screen">
    <div class="container m-auto mt-32 max-h-72">
        <div
            class="scrollbar mx-auto grid w-9/12 animate-flip-down grid-cols-1 gap-16 gap-x-6 overflow-auto p-4 animate-delay-300 animate-duration-1000 md:grid-cols-2 lg:grid-cols-3"
            style="max-height: 49rem"
        >
            <div *ngFor="let local of locals" class="relative h-full">
                <div
                    class="h-full w-full overflow-hidden rounded-lg bg-white bg-opacity-55 shadow-sm duration-300 hover:scale-105"
                >
                    <img
                        *ngIf="local.logo"
                        [src]="'https://localhost:44333/resources' + local.logo"
                        class="h-48 w-full object-cover"
                        alt="..."
                    />
                    <div
                        *ngIf="!local.logo"
                        class="flex h-48 w-full items-center justify-center bg-gray-300"
                    >
                        <span class="text-lg text-gray-700"
                            >No Logo Available</span
                        >
                    </div>
                    <div class="p-4">
                        <h1 class="mb-6 text-2xl font-semibold uppercase">
                            {{ local.name }}
                        </h1>
                        <h2 class="mt-2 flex items-center text-lg">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                fill="currentColor"
                                class="bi bi-geo-alt mr-2"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A31.493 31.493 0 0 1 8 14.58a31.481 31.481 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94zM8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10z"
                                ></path>
                                <path
                                    d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"
                                ></path>
                            </svg>
                            <span>{{ local.city }}</span>
                        </h2>
                        <h3 class="mb-7 mt-2 flex items-center text-lg">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                fill="currentColor"
                                class="bi bi-currency-dollar"
                                viewBox="0 0 16 16"
                            >
                                <path
                                    d="M4 10.781c.148 1.667 1.513 2.85 3.591 3.003V15h1.043v-1.216c2.27-.179 3.678-1.438 3.678-3.3 0-1.59-.947-2.51-2.956-3.028l-.722-.187V3.467c1.122.11 1.879.714 2.07 1.616h1.47c-.166-1.6-1.54-2.748-3.54-2.875V1H7.591v1.233c-1.939.23-3.27 1.472-3.27 3.156 0 1.454.966 2.483 2.661 2.917l.61.162v4.031c-1.149-.17-1.94-.8-2.131-1.718zm3.391-3.836c-1.043-.263-1.6-.825-1.6-1.616 0-.944.704-1.641 1.8-1.828v3.495l-.2-.05zm1.591 1.872c1.287.323 1.852.859 1.852 1.769 0 1.097-.826 1.828-2.2 1.939V8.73z"
                                />
                            </svg>

                            {{ local.dateTime | date: 'dd.MM.yyyy. HH:mm' }}
                        </h3>
                        <div class="mt-4">
                            <button
                                class="absolute bottom-0 left-0 flex h-9 w-full items-center rounded bg-zinc-500 px-4 py-1 font-semibold text-zinc-50 duration-300 hover:bg-zinc-950"
                            >
                                Details
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    fill="currentColor"
                                    class="ml-auto"
                                    viewBox="0 0 16 16"
                                >
                                    <path
                                        d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM4.5 7.5a.5.5 0 0 0 0 1h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H4.5z"
                                    ></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
