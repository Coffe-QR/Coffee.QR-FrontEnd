<div
    class="flex h-screen flex-col items-center justify-center bg-gradient-to-tr from-orange-500 to-black p-4"
>
    <div
        class="flex w-full max-w-7xl flex-col rounded-lg bg-white bg-opacity-25 px-4 py-6 text-center shadow-lg"
    >
        <h1
            class="mb-6 text-center text-3xl font-bold text-stone-800 md:text-4xl"
        >
            Supply list
        </h1>
        <div class="flex flex-col gap-x-4 md:flex-row">
            <!-- Dugmad za filtriranje kategorija -->
            <div
                class="mb-4 w-full overflow-y-auto rounded-md bg-gray-50 bg-opacity-0 p-4 md:mb-0 md:w-1/6"
            >
                <button
                    class="mb-2 w-full rounded bg-stone-700 px-4 py-2 font-bold text-white duration-300 hover:bg-stone-400 hover:text-black"
                    (click)="filterCategory(0)"
                >
                    Ordered
                </button>
                <button
                    class="mb-2 w-full rounded bg-stone-700 px-4 py-2 font-bold text-white duration-300 hover:bg-stone-400 hover:text-black"
                    (click)="filterCategory(1)"
                >
                    Taken
                </button>
                <button
                    class="mb-2 w-full rounded bg-stone-700 px-4 py-2 font-bold text-white duration-300 hover:bg-stone-400 hover:text-black"
                    (click)="filterCategory(2)"
                >
                    Mistake
                </button>
                <button
                    class="mb-2 w-full rounded bg-stone-700 px-4 py-2 font-bold text-white duration-300 hover:bg-stone-400 hover:text-black"
                    (click)="filterCategory(3)"
                >
                    Confirmed
                </button>
            </div>

            <!-- Lista snabdevanja -->

            <div class="flex-1">
                <div class="max-h-[600px] overflow-y-auto">
                    <div class="overflow-x-auto">
                        <table class="min-w-full bg-white">
                            <thead
                                class="fix sticky top-0 z-10 bg-stone-700 text-white"
                            >
                                <tr>
                                    <th
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        ID
                                    </th>
                                    <th
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        Company name
                                    </th>
                                    <th
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        Total Price
                                    </th>
                                    <th
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        Status
                                    </th>
                                    <th
                                        class="border-b border-gray-200 px-4 py-2"
                                    ></th>
                                    <th
                                        class="border-b border-gray-200 px-4 py-2"
                                    ></th>
                                    <th
                                        class="border-b border-gray-200 px-4 py-2"
                                    ></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr
                                    *ngFor="let item of suppliesDisplaying"
                                    class="hover:bg-gray-100"
                                >
                                    <td
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        {{ item.id }}
                                    </td>
                                    <td
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        {{ item.companyName }}
                                    </td>
                                    <td
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        ${{ item.totalPrice.toFixed(2) }}
                                    </td>
                                    <td
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        {{ getStatusText(item.status) }}
                                    </td>
                                    <td
                                        class="border-b border-gray-200 px-4 py-2"
                                    >
                                        <button
                                            (click)="details(item)"
                                            class="rounded bg-stone-700 px-3 py-2 text-white hover:bg-stone-400 hover:text-black"
                                        >
                                            Details
                                        </button>
                                    </td>
                                    <td class="border-b border-gray-200 py-2">
                                        <button
                                            (click)="details(item)"
                                            *ngIf="selectedStatus !== 3"
                                            class="rounded bg-stone-700 px-3 py-2 text-white hover:bg-stone-400 hover:text-black"
                                        >
                                            {{ getButtonName(item) }}
                                        </button>
                                    </td>
                                    <td class="border-b border-gray-200 py-2">
                                        <button
                                            (click)="details(item)"
                                            *ngIf="selectedStatus === 0"
                                            class="rounded bg-stone-700 px-3 py-2 text-white hover:bg-stone-400 hover:text-black"
                                        >
                                            Error
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- KRAJ-->
        </div>
    </div>
</div>
